name: Construir Windows 3.0.0

on:
  push:
    branches: ['**']
    paths:
      - 'pdfmodder/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'installer/**'
      - 'assets/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'README.md'
      - 'PDFModder.spec'
      - 'run_pdfmodder.py'
      - '.github/workflows/windows-release.yml'
  pull_request:
    paths:
      - 'pdfmodder/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'installer/**'
      - 'assets/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'README.md'
      - 'PDFModder.spec'
      - 'run_pdfmodder.py'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar esta entrega comprobada (sólo main)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Instalar dependencias fijadas
        run: ./scripts/install.ps1 -Development -PythonExe (Get-Command python).Source
      - name: Comprobar, compilar y empaquetar
        run: >-
          .venv/Scripts/python.exe scripts/release_v300.py --headless-qa --tests tests
      - name: Conservar entregas y diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDFModder-v3.0.0-Windows-${{ github.sha }}
          path: |
            releases/v3.0.0/
            output/release-v*-*.log
            output/pytest-v300-results.xml
            output/*v300*smoke*
            output/v300-source-tests.json
            output/portability/**/resultado.json
            output/portability/**/instalacion.json
            output/portability/**/desinstalacion.json
            output/portability/**/editor-instalado-v300.json
            output/portability/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: PDFModder-v3.0.0-Windows-${{ github.sha }}
          path: .
      - name: Instalar dependencias del publicador
        run: >-
          python -m pip install requests==2.34.2 charset-normalizer==3.5.1
          idna==3.20 urllib3==2.8.0 certifi==2026.7.22
      - name: Publicar instalador, portable, fuentes y manifiesto
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_github_releases.py --version 3.0.0
