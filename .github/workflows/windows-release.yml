name: Construir y publicar Windows

on:
  push:
    branches: ['**']
    paths:
      - 'pdfmodder/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'installer/**'
      - 'assets/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'README.md'
      - 'PDFModder.spec'
      - 'run_pdfmodder.py'
      - '.github/workflows/windows-release.yml'
  pull_request:
    paths:
      - 'pdfmodder/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'installer/**'
      - 'assets/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'README.md'
      - 'PDFModder.spec'
      - 'run_pdfmodder.py'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar esta entrega comprobada (sólo main)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}-bounded-v318-2022
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Retirar ejecuciones obsoletas de esta entrega
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseHeaders = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $obsoleteRuns = @{ "41602014184" = "86f14e3fff11be116cbe999b5543d25c9e636786"; "41601765677" = "ccc7fab7fd1ab102821b85bb819a883093bbe917"; "41599681979" = "81f6fd24e80902e314f6be6801f445cd06253f98" }
          foreach ($obsoleteId in @("41602014184", "41601765677", "41599681979")) {
            $releaseApi = "https://api.github.com/repos/satagrolevante/PDFModder/actions/runs/$obsoleteId"
            $obsoleteRun = Invoke-RestMethod -Uri $releaseApi -Headers $releaseHeaders
            if ($obsoleteRun.head_branch -ne "version-3.0.18-publicacion" -or $obsoleteRun.head_sha -ne $obsoleteRuns[$obsoleteId]) { throw "La ejecución no corresponde a esta entrega." }
            if ($obsoleteRun.status -ne "completed") {
              Invoke-RestMethod -Method Post -Uri "$releaseApi/cancel" -Headers $releaseHeaders
              Write-Host "Cancelada la ejecución obsoleta $obsoleteId."
            }
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Identificar versión de entrega
        id: release
        run: |
          $releaseVersion = python -c "from pdfmodder import __version__; print(__version__)"
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT
      - name: Instalar dependencias fijadas
        run: ./scripts/install.ps1 -Development -PythonExe (Get-Command python).Source
      - name: Comprobar fuentes y recorrido GUI
        timeout-minutes: 10
        env:
          PYTEST_ADDOPTS: '-vv -o faulthandler_timeout=60'
          PYTHONUNBUFFERED: '1'
        run: >-
          .venv/Scripts/python.exe scripts/release_v300.py --source-only --headless-qa --tests
          tests/test_search_v306.py tests/test_search_session_v306.py
          tests/test_search_panel_v306.py tests/test_search_render_v306.py tests/test_search_ui_v306.py
          tests/test_scroll_cursor_v306.py tests/test_upgrade_cleanup_v306.py tests/test_release_cleanup_v306.py
          tests/test_daily_updates_v307.py tests/test_daily_updates_ui_v307.py
          tests/test_menus_ui_v308.py tests/test_view_zoom_ui_v308.py tests/test_sharing_ui_v308.py
          tests/test_progressive_ui_v300.py tests/test_tools_ui_v150.py
          tests/test_print_dialog_v309.py tests/test_print_controller_v309.py
          tests/test_print_options_v201.py tests/test_printing_v200.py
          tests/test_print_worker_v314.py tests/test_print_device_v314.py
          tests/test_print_dialog_v314.py tests/test_print_pipeline_v314.py
          tests/test_action_state_v310.py tests/test_navigation_ui_v310.py
          tests/test_sidebar_ui_v311.py
          tests/test_preferences_ui_v311.py tests/test_selection_fluency_v311.py
          tests/test_responsive_actions_v310.py tests/test_responsive_ui_v310.py
          tests/test_shell_requests_v305.py tests/test_shell_worker_v305.py
          tests/test_shell_ui_v305.py tests/test_office_conversion_v305.py
          tests/test_shell_registration_v305.py tests/test_pdf_associations_v202.py
          tests/test_draft_cancellation_v305.py tests/test_analysis_reuse_v305.py
          tests/test_draft_serialization_v305.py tests/test_draft_session_v305.py
          tests/test_added_text_transactions_v315.py tests/test_analysis_reuse_v315.py
          tests/test_auto_overlap_v315.py tests/test_canvas_border_v150.py
          tests/test_owned_text_v316.py tests/test_auto_adapt_v316.py
          tests/test_preserved_graphics_v316.py tests/test_image_transactions_v316.py
          tests/test_manual_signatures_v317.py tests/test_signature_draw_ui_v317.py
          tests/test_signature_dialog_v317.py tests/test_signature_manual_appearance_v317.py
          tests/test_signatures_panel_v317.py tests/test_signature_tagged_deletion_v317.py
          tests/test_clipboard_fast_v318.py tests/test_split_content_v318.py
          tests/test_scoped_validation_v318.py tests/test_tagged_reuse_v318.py
          tests/test_tagged_move_v318.py tests/test_validation_evidence_v318.py
          tests/test_tagged_signature_v318.py tests/test_print_background_v318.py
          tests/test_prepared_views_v318.py tests/test_lazy_page_ui_v318.py
          tests/test_source_analysis_v318.py tests/test_image_validation_reuse_v318.py
          tests/test_transaction_write_v318.py
          tests/test_page_fingerprint.py tests/test_tagged_validation_cache.py
          tests/test_tagged_page_proof.py tests/test_unchanged_page_validation.py
          tests/test_text_structure_reuse.py tests/test_atomic_save_exact.py
          tests/test_clip_paths_v304.py tests/test_complex_clip_deletion_v304.py
          tests/test_tagged_irregularities_v304.py tests/test_stroked_native_v304.py
          tests/test_source_decorations_v304.py
          tests/test_footer_native_v303.py tests/test_marked_content_v303.py
          tests/test_deletion_layout_v303.py tests/test_paragraph_scopes_v303.py
          tests/test_filled_cell_borders_v303.py tests/test_linked_text_v303.py
          tests/test_pdf_object_identity_v303.py tests/test_tagged_inplace_v303.py
          tests/test_neighbor_layout_v303.py tests/test_neighbor_draft_ui_v303.py
          tests/test_neighbor_session_v303.py tests/test_rich_overlap_preservation.py
          tests/test_text_clips.py tests/test_tagged_nested.py
          tests/test_rich_ui_v09.py tests/test_rich_validation_reuse.py
          tests/test_compatibility_v300.py tests/test_update_channel_v203.py
          tests/test_update_saving_v300.py
      - name: Compilar y comprobar ejecutable e instalador
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: '1'
        run: .venv/Scripts/python.exe scripts/release_v300.py --start build --headless-qa
      - name: Conservar entregas y diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDFModder-v${{ steps.release.outputs.version }}-Windows-${{ github.sha }}
          path: |
            releases/v${{ steps.release.outputs.version }}/
            output/release-v*-*.log
            output/pytest-v300-results.xml
            output/*v300*smoke*
            output/v300-source-tests.json
            output/upgrade-cleanup-v306.json
            output/portability/**/resultado.json
            output/portability/**/instalacion.json
            output/portability/**/desinstalacion.json
            output/portability/**/editor-instalado-v300.json
            output/portability/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
      || (github.event_name == 'push' && github.ref == 'refs/heads/version-3.0.18-publicacion')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: PDFModder-v${{ needs.build.outputs.version }}-Windows-${{ github.sha }}
          path: .
      - name: Instalar dependencias del publicador
        run: >-
          python -m pip install requests==2.34.2 charset-normalizer==3.5.1
          idna==3.20 urllib3==2.8.0 certifi==2026.7.22
      - name: Publicar instalador, portable, fuentes y manifiesto
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/publish_github_releases.py --version ${{ needs.build.outputs.version }}
          --notes-file docs/NOTAS_${{ needs.build.outputs.version }}.md
      - name: Retirar publicaciones anteriores tras verificar la actualización pública
        if: needs.build.outputs.version == '3.0.16'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/cleanup_previous_releases.py --keep v3.0.16 --apply
          --report output/github-cleanup-v3.0.16.json
      - name: Conservar informe de limpieza de publicaciones
        if: always() && needs.build.outputs.version == '3.0.16'
        uses: actions/upload-artifact@v4
        with:
          name: PDFModder-v3.0.16-limpieza-${{ github.sha }}
          path: output/github-cleanup-v3.0.16.json
          if-no-files-found: ignore
          retention-days: 14
