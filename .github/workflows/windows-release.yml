name: Comprobar conversión Word en Windows

on:
  push:
    branches: [correccion-conversion-word]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Instalar dependencias de las comprobaciones
        run: >-
          python -m pip install --only-binary=:all: PyMuPDF==1.26.7 pypdf==6.6.0 pytest==9.0.2
      - name: Comprobar conversor y contrato nativo PowerShell
        run: >-
          python -m pytest -v --tb=short
          --junitxml=output/office-fix-v325/windows.xml
          tests/test_office_conversion_v305.py tests/test_office_word_v325.py
      - name: Conservar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Word-conversion-Windows-checks
          path: output/office-fix-v325/windows.xml
          retention-days: 14
