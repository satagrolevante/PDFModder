name: Publicar entrega 3.0.0 ya comprobada

on:
  push:
    branches: [main, version-3.0.0]
    paths: ['.github/workflows/publish-prebuilt.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-prebuilt-v300
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'satagrolevante/PDFModder'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2b2f1fe4154e8df40607acb54e1eb144dcf74436
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recuperar la entrega comprobada en Windows
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: satagrolevante/PDFModder
          run-id: 37894463231
          name: PDFModder-v3.0.0-Windows-2b2f1fe4154e8df40607acb54e1eb144dcf74436
          path: .
      - name: Instalar dependencia del publicador
        run: >-
          python -m pip install --disable-pip-version-check requests==2.34.2
          charset-normalizer==3.5.1 idna==3.20 urllib3==2.8.0 certifi==2026.7.22
      - name: Publicar los archivos comprobados sin recompilar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: 2b2f1fe4154e8df40607acb54e1eb144dcf74436
        run: python scripts/publish_github_releases.py --version 3.0.0
