name: Publicar entrega 2.0.3 ya comprobada

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-prebuilt.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-prebuilt-v203
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'satagrolevante/PDFModder'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recuperar la entrega comprobada en Windows
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: satagrolevante/PDFModder
          run-id: 37313639989
          name: PDFModder-Windows-a763cfe12e56c13dd636ac1ad8605bf20ff2d600
          path: .
      - name: Instalar dependencia del publicador
        run: python -m pip install --disable-pip-version-check requests==2.34.2
      - name: Esperar la visibilidad pública autorizada
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          request = urllib.request.Request(
              'https://api.github.com/repos/satagrolevante/PDFModder',
              headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'User-Agent': 'PDFModder-publisher'})
          deadline = time.monotonic() + 570
          while True:
              with urllib.request.urlopen(request, timeout=30) as response:
                  repository = json.load(response)
              if not repository['private']:
                  break
              if time.monotonic() >= deadline:
                  raise RuntimeError('El repositorio sigue privado; confirme el cambio de visibilidad y reejecute este workflow.')
              print('Pendiente de confirmar Public en el repositorio.', flush=True)
              time.sleep(30)
          PY
      - name: Publicar los archivos comprobados sin recompilar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: a763cfe12e56c13dd636ac1ad8605bf20ff2d600
        run: python scripts/publish_github_releases.py --version 2.0.3
